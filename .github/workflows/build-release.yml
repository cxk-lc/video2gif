name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow==12.3.0 imageio-ffmpeg==0.6.0 pyinstaller==6.22.3

      - name: Fetch bundled ffmpeg
        run: python tools/get_ffmpeg.py

      - name: Build standalone exe
        run: python tools/build_exe.py

      - name: Smoke test exe (end-to-end selftest)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\视频转GIF动图.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code:" $p.ExitCode
          if ($p.ExitCode -ne 0) { throw "exe selftest failed" }

      - name: Create GitHub Release with exe asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 先复制为 ASCII 文件名再上传：GitHub 上传接口会剥离非 ASCII 字符，
          # 直接上传中文名会得到被清洗过的残缺资产名
          cp "dist/视频转GIF动图.exe" "dist/VideoGif-${TAG}-win64.exe"
          ASSET="dist/VideoGif-${TAG}-win64.exe"
          # Release 标题格式（约定）：视频转GIF动图 + 空格 + 版本号
          TITLE="视频转GIF动图 ${TAG}"
          NOTES="docs/release-notes-${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" "$ASSET" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --generate-notes
          fi
