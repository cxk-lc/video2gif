name: fix-release-asset

# 一次性维护工具：把 v0.1.1 发布中被 GitHub 清洗过的资产名（GIF.exe）
# 原地重命名为 VideoGif-v0.1.1-win64.exe。幂等：资产已正确时不做任何事。

on:
  push:
    paths:
      - ".github/workflows/fix-release-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-legacy-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Rename legacy asset (GIF.exe -> VideoGif-v0.1.1-win64.exe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          ASSET_ID=$(gh api "repos/${REPO}/releases/tags/v0.1.1" --jq '.assets[] | select(.name=="GIF.exe") | .id' || true)
          if [ -n "$ASSET_ID" ]; then
            gh api -X PATCH "repos/${REPO}/releases/assets/${ASSET_ID}" -f name="VideoGif-v0.1.1-win64.exe"
            echo "renamed asset ${ASSET_ID}"
          else
            echo "no legacy asset found (already fixed)"
          fi
